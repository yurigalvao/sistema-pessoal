{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <title>Excluir Tarefa</title>
    <link rel="stylesheet" href="{% static 'trabalho/style.css' %}">
</head>
<body>
    <h1>Excluir Tarefa</h1>

    <p>Tem certeza que deseja excluir "{{ tarefa.titulo }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Excluir</button>
    </form>

    <a href="{% url 'lista_tarefas' %}" class="btn btn-secondary">Cancelar</a>
</body>
</html>
